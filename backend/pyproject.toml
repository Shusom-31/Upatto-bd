[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tathyashala-api"
version = "0.1.0"
description = "Guest workspace API for data cleaning and analytics"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.4,<3.0",
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "openpyxl>=3.1,<4.0",
  "reportlab>=4.2,<5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 120
